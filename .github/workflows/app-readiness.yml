name: App readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
      - run: npm ci
      - run: npm run audit:policy
      - run: npm run audit:secrets
      - run: npm run audit:dependencies
        continue-on-error: true
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - run: npm run audit:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-readiness-report
          path: reports/

  android-release:
    runs-on: ubuntu-latest
    needs: static-audit
    if: ${{ vars.ANDROID_RELEASE_READY == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: cd android && ./gradlew :app:assembleRelease
